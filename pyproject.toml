[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cozmo-scan"
version = "0.1.0"
description = "Property scanning CLI and analysis pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
